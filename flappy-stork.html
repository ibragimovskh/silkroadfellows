<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Laylak — Silkroad Fellows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4EFE3;
    --bg-elevated: #FAF6EC;
    --ink: #1A1F1B;
    --ink-muted: #6B6F6C;
    --accent: #14532D;
    --accent-hover: #0F3D22;
    --border: rgba(20, 31, 27, 0.12);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Instrument Sans', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px 16px;
    gap: 16px;
  }
  a.back {
    color: var(--ink-muted);
    text-decoration: none;
    font-size: 14px;
    align-self: flex-start;
  }
  a.back:hover { color: var(--accent); }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--ink-muted);
    font-size: 15px;
    text-align: center;
    max-width: 420px;
  }
  .stage {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(20, 31, 27, 0.25);
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    touch-action: none;
  }
  canvas {
    display: block;
    background: #cfe8f0;
  }
  .hint {
    color: var(--ink-muted);
    font-size: 13px;
  }
  .footer-row {
    display: flex;
    gap: 20px;
    align-items: center;
  }
</style>
</head>
<body>
  <a class="back" href="/">← silkroadfellows.com</a>
  <h1>Flappy Laylak 🪶</h1>
  <p class="subtitle">Guide the laylak (stork) between the minarets. Tap, click, or press space to flap.</p>

  <div class="stage">
    <canvas id="game" width="400" height="600"></canvas>
  </div>

  <div class="footer-row">
    <span class="hint">Space / Click / Tap to flap · R to restart</span>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const GROUND_H = 90;
  const GRAVITY = 1500;       // px/s^2
  const FLAP_VELOCITY = -420; // px/s
  const MAX_FALL = 620;
  const PIPE_W = 78;          // minaret shaft width
  const PIPE_GAP = 168;
  const PIPE_SPEED = 165;     // px/s
  const PIPE_INTERVAL = 1.45; // seconds

  const BEST_KEY = 'flappy-laylak-best';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);

  let state = 'start'; // start | playing | dead
  let score = 0;
  let flashT = 0;

  const bird = {
    x: 110,
    y: H / 2,
    vy: 0,
    r: 16,
    rot: 0,
    wingPhase: 0,
    flapping: 0,
  };

  let pipes = []; // {x, gapY, passed}
  let spawnTimer = 0;
  let groundOffset = 0;
  let last = null;
  let elapsed = 0;

  function reset() {
    bird.y = H / 2;
    bird.vy = 0;
    bird.rot = 0;
    bird.wingPhase = 0;
    pipes = [];
    spawnTimer = 0;
    score = 0;
    elapsed = 0;
    state = 'start';
  }

  function flap() {
    if (state === 'start') {
      state = 'playing';
    }
    if (state === 'playing') {
      bird.vy = FLAP_VELOCITY;
      bird.flapping = 1;
    } else if (state === 'dead') {
      // small delay to avoid accidental instant restart
      if (flashT <= 0) reset();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); flap(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });
  canvas.addEventListener('mousedown', flap);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });

  function spawnPipe() {
    const margin = 70;
    const gapY = margin + Math.random() * (H - GROUND_H - margin * 2 - PIPE_GAP) + PIPE_GAP / 2;
    pipes.push({ x: W + PIPE_W, gapY, passed: false });
  }

  function rectCircleCollide(rx, ry, rw, rh, cx, cy, cr) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return (dx * dx + dy * dy) < cr * cr;
  }

  function update(dt) {
    groundOffset -= PIPE_SPEED * dt;
    if (groundOffset < -40) groundOffset += 40;

    if (state === 'playing') {
      elapsed += dt;
      bird.vy += GRAVITY * dt;
      if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 500));

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnPipe();
        spawnTimer = PIPE_INTERVAL;
      }

      for (const p of pipes) {
        p.x -= PIPE_SPEED * dt;
        if (!p.passed && p.x + PIPE_W < bird.x - bird.r) {
          p.passed = true;
          score++;
        }
      }
      pipes = pipes.filter((p) => p.x > -PIPE_W - 10);

      // collisions
      const topH = 0;
      for (const p of pipes) {
        const gapTop = p.gapY - PIPE_GAP / 2;
        const gapBottom = p.gapY + PIPE_GAP / 2;
        if (rectCircleCollide(p.x, 0, PIPE_W, gapTop, bird.x, bird.y, bird.r * 0.8) ||
            rectCircleCollide(p.x, gapBottom, PIPE_W, H - GROUND_H - gapBottom, bird.x, bird.y, bird.r * 0.8)) {
          die();
        }
      }
      if (bird.y + bird.r >= H - GROUND_H) {
        bird.y = H - GROUND_H - bird.r;
        die();
      }
      if (bird.y - bird.r <= 0) {
        bird.y = bird.r;
        bird.vy = 0;
      }
    } else if (state === 'start') {
      bird.y = H / 2 + Math.sin(performance.now() / 300) * 6;
    } else if (state === 'dead') {
      if (flashT > 0) flashT -= dt;
      if (bird.y + bird.r < H - GROUND_H) {
        bird.vy += GRAVITY * dt;
        bird.y += bird.vy * dt;
        bird.rot = Math.min(1.4, bird.rot + dt * 2);
      } else {
        bird.y = H - GROUND_H - bird.r;
      }
    }

    bird.wingPhase += dt * (state === 'playing' ? 10 : 4);
  }

  function die() {
    if (state !== 'dead') {
      state = 'dead';
      flashT = 0.25;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
    }
  }

  // ---------- Drawing ----------

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#bfe3ee');
    g.addColorStop(0.6, '#e7d9b8');
    g.addColorStop(1, '#f0e2bd');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun
    ctx.fillStyle = 'rgba(255, 232, 176, 0.9)';
    ctx.beginPath();
    ctx.arc(W - 60, 80, 34, 0, Math.PI * 2);
    ctx.fill();

    // distant dome silhouettes
    ctx.fillStyle = 'rgba(20, 83, 45, 0.15)';
    const bx = (performance.now() / 20000) % (W + 200);
    drawFarDome(W - bx + 40, H - GROUND_H, 26);
    drawFarDome(W - bx + 160, H - GROUND_H, 18);
    drawFarDome(W - bx - 120, H - GROUND_H, 22);
  }

  function drawFarDome(x, baseY, r) {
    ctx.beginPath();
    ctx.moveTo(x - r, baseY);
    ctx.lineTo(x - r, baseY - r * 1.4);
    ctx.arc(x, baseY - r * 1.4, r, Math.PI, 0);
    ctx.lineTo(x + r, baseY);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround() {
    ctx.fillStyle = '#D9B978';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#C7A55E';
    ctx.fillRect(0, H - GROUND_H, W, 10);
    ctx.strokeStyle = 'rgba(120, 90, 40, 0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = groundOffset; x < W + 40; x += 40) {
      ctx.moveTo(x, H - GROUND_H + 20);
      ctx.lineTo(x + 20, H - GROUND_H + 30);
    }
    ctx.stroke();
  }

  // Draw a minaret. facing = 'up' (rises from ground, cap at top)
  // or 'down' (hangs from ceiling, cap at bottom)
  function drawMinaret(x, edgeY, height, facing) {
    const w = PIPE_W;
    const capR = w * 0.62;
    const shaftTopTaper = 6;

    ctx.save();
    if (facing === 'up') {
      // base sits at the ground (below), tip/dome sits at the gap edge (above) -> flip vertically
      ctx.translate(x, edgeY + height);
      ctx.scale(1, -1);
    } else {
      // 'down': base sits at the ceiling (y=0), tip/dome sits at the gap edge (below) -> no flip needed
      ctx.translate(x, 0);
    }
    // local y=0 is the shaft base (far end), local y=height is the tip/dome (gap edge)

    // shaft
    const shaftGrad = ctx.createLinearGradient(0, 0, w, 0);
    shaftGrad.addColorStop(0, '#E8D7A8');
    shaftGrad.addColorStop(0.5, '#F3E6C4');
    shaftGrad.addColorStop(1, '#D9C48F');
    ctx.fillStyle = shaftGrad;
    ctx.beginPath();
    ctx.moveTo(shaftTopTaper, 0);
    ctx.lineTo(w - shaftTopTaper, 0);
    ctx.lineTo(w, height - 34);
    ctx.lineTo(0, height - 34);
    ctx.closePath();
    ctx.fill();

    // vertical fluting lines
    ctx.strokeStyle = 'rgba(150, 120, 60, 0.25)';
    ctx.lineWidth = 1.5;
    for (let i = 1; i < 4; i++) {
      const fx = (w / 4) * i;
      ctx.beginPath();
      ctx.moveTo(fx, 4);
      ctx.lineTo(fx, height - 36);
      ctx.stroke();
    }

    // balcony (şerefe) ring near the gap edge
    ctx.fillStyle = '#B98D4A';
    ctx.fillRect(-6, height - 40, w + 12, 10);
    ctx.fillStyle = '#8F6A32';
    ctx.fillRect(-6, height - 32, w + 12, 4);

    // little balcony rail posts
    ctx.fillStyle = '#8F6A32';
    for (let i = 0; i <= 6; i++) {
      const px = -4 + (i * (w + 8)) / 6;
      ctx.fillRect(px, height - 40, 2, 8);
    }

    // upper cap section (between balcony and dome)
    const capGrad = ctx.createLinearGradient(0, 0, w, 0);
    capGrad.addColorStop(0, '#DCCB9C');
    capGrad.addColorStop(0.5, '#EFE0B8');
    capGrad.addColorStop(1, '#CBB57F');
    ctx.fillStyle = capGrad;
    ctx.beginPath();
    ctx.moveTo(6, height - 34);
    ctx.lineTo(w - 6, height - 34);
    ctx.lineTo(w * 0.5 + capR * 0.35, height - 8);
    ctx.lineTo(w * 0.5 - capR * 0.35, height - 8);
    ctx.closePath();
    ctx.fill();

    // dome
    ctx.fillStyle = '#146B4A';
    ctx.beginPath();
    ctx.moveTo(w / 2 - capR * 0.42, height - 8);
    ctx.quadraticCurveTo(w / 2 - capR * 0.5, height - capR * 1.15, w / 2, height - capR * 1.35);
    ctx.quadraticCurveTo(w / 2 + capR * 0.5, height - capR * 1.15, w / 2 + capR * 0.42, height - 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.ellipse(w / 2 - capR * 0.12, height - capR * 1.05, capR * 0.18, capR * 0.4, 0.3, 0, Math.PI * 2);
    ctx.fill();

    // finial spike + crescent
    ctx.strokeStyle = '#8F6A32';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(w / 2, height - capR * 1.35);
    ctx.lineTo(w / 2, height - capR * 1.35 - 16);
    ctx.stroke();
    ctx.fillStyle = '#E8C468';
    ctx.beginPath();
    ctx.arc(w / 2, height - capR * 1.35 - 20, 5, 0.6, Math.PI * 2 - 0.6);
    ctx.arc(w / 2 + 2.2, height - capR * 1.35 - 20, 4, Math.PI + 0.9, Math.PI - 0.9, true);
    ctx.fill();

    ctx.restore();
  }

  function drawPipes() {
    for (const p of pipes) {
      const gapTop = p.gapY - PIPE_GAP / 2;
      const gapBottom = p.gapY + PIPE_GAP / 2;
      // top minaret hangs from ceiling, cap points down at gapTop
      drawMinaret(p.x, gapTop, gapTop, 'down');
      // bottom minaret rises from ground, cap points up at gapBottom
      drawMinaret(p.x, gapBottom, (H - GROUND_H) - gapBottom, 'up');
    }
  }

  function drawStork() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    const flap = Math.sin(bird.wingPhase) * (state === 'dead' ? 0.1 : 0.55);

    // legs trailing behind
    ctx.strokeStyle = '#D64545';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-4, 10);
    ctx.lineTo(-10, 20);
    ctx.moveTo(2, 11);
    ctx.lineTo(-2, 21);
    ctx.stroke();

    // tail
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath();
    ctx.moveTo(-14, -2);
    ctx.lineTo(-24, -6);
    ctx.lineTo(-22, 2);
    ctx.closePath();
    ctx.fill();

    // back wing (far side, subtler)
    ctx.save();
    ctx.translate(-2, -2);
    ctx.rotate(-0.3 - flap);
    ctx.fillStyle = '#d9d9d9';
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(9, 1, 6, 3.2, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // body
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // near wing (animated)
    ctx.save();
    ctx.translate(-1, -1);
    ctx.rotate(-0.2 - flap);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#262626';
    ctx.beginPath();
    ctx.ellipse(10, 1, 7, 3.6, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // neck + head
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(15, -9, 7, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // red skin patch near eye
    ctx.fillStyle = '#C23B3B';
    ctx.beginPath();
    ctx.ellipse(17.5, -9, 2, 3, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // eye
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(18.5, -11, 1.4, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#E2622A';
    ctx.beginPath();
    ctx.moveTo(21, -12);
    ctx.lineTo(34, -9.5);
    ctx.lineTo(21, -7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(21, -9.5);
    ctx.lineTo(33, -9.5);
    ctx.stroke();

    ctx.restore();
  }

  function drawScore() {
    ctx.font = "600 42px 'Fraunces', Georgia, serif";
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(20,31,27,0.5)';
    ctx.fillStyle = '#FAF6EC';
    ctx.strokeText(String(score), W / 2, 70);
    ctx.fillText(String(score), W / 2, 70);
  }

  function drawCenterCard(lines) {
    const cardW = 280, cardH = 26 + lines.length * 34 + 20;
    const cardX = W / 2 - cardW / 2;
    const cardY = H / 2 - cardH / 2 - 20;
    ctx.fillStyle = 'rgba(250, 246, 236, 0.94)';
    ctx.strokeStyle = 'rgba(20,31,27,0.15)';
    ctx.lineWidth = 1.5;
    roundRect(cardX, cardY, cardW, cardH, 16);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    let y = cardY + 40;
    lines.forEach((line, i) => {
      ctx.font = line.font || "500 17px 'Instrument Sans', sans-serif";
      ctx.fillStyle = line.color || '#1A1F1B';
      ctx.fillText(line.text, W / 2, y);
      y += 34;
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    drawSky();
    drawPipes();
    drawGround();
    drawStork();

    if (state === 'playing') {
      drawScore();
    } else if (state === 'start') {
      drawCenterCard([
        { text: 'Flappy Laylak', font: "600 26px 'Fraunces', Georgia, serif" },
        { text: 'Tap / click / space to flap', color: '#6B6F6C' },
        { text: `Best: ${best}`, color: '#14532D' },
      ]);
    } else if (state === 'dead') {
      drawScore();
      drawCenterCard([
        { text: 'You struck a minaret', font: "600 22px 'Fraunces', Georgia, serif" },
        { text: `Score: ${score}    Best: ${best}` },
        { text: 'Tap to try again', color: '#6B6F6C' },
      ]);
    }
  }

  function loop(ts) {
    if (last === null) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05; // clamp big jumps (tab switch)
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
